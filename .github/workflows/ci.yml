name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qsp_admin
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: qsp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Check Python syntax
      run: |
        cd backend
        python -m compileall -q app migrations

    - name: Run database migrations
      run: |
        cd backend
        alembic upgrade head
      env:
        DATABASE_URL: postgresql+asyncpg://qsp_admin:testpass@localhost:5432/qsp_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci-only-32chars

    - name: Verify migrated schema
      run: |
        cd backend
        python - <<'PY'
        import asyncio
        from sqlalchemy import inspect
        from app.core.database import engine

        EXPECTED_TABLES = {
            "users", "trades", "positions", "orders", "strategy_configs",
            "risk_profiles", "risk_events", "trade_journals",
            "performance_reports", "licenses", "license_usage",
            "audit_logs", "system_health", "notifications",
        }

        async def verify():
            async with engine.connect() as connection:
                tables = set(await connection.run_sync(
                    lambda sync_connection: inspect(sync_connection).get_table_names()
                ))
            missing = EXPECTED_TABLES - tables
            if missing:
                raise SystemExit(f"Migration did not create tables: {sorted(missing)}")
            await engine.dispose()

        asyncio.run(verify())
        PY
      env:
        DATABASE_URL: postgresql+asyncpg://qsp_admin:testpass@localhost:5432/qsp_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci-only-32chars

    - name: Run tests
      run: |
        cd backend
        pytest -v --cov=app --cov-report=xml
      env:
        DATABASE_URL: postgresql+asyncpg://qsp_admin:testpass@localhost:5432/qsp_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci-only-32chars

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        docker-compose build

    - name: Push to registry
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker-compose push
