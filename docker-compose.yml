version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qsp-postgres
    environment:
      POSTGRES_USER: qsp_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePass123!}
      POSTGRES_DB: quantum_scalper_pro
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsp_admin -d quantum_scalper_pro"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qsp-network

  redis:
    image: redis:7-alpine
    container_name: qsp-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisPass123!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - qsp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qsp-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://qsp_admin:${POSTGRES_PASSWORD:-SecurePass123!}@postgres:5432/quantum_scalper_pro
      - REDIS_URL=redis://:${REDIS_PASSWORD:-RedisPass123!}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY:-}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - MT5_SERVER=${MT5_SERVER:-}
      - MT5_LOGIN=${MT5_LOGIN:-}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - NEWS_API_URL=${NEWS_API_URL:-https://finnhub.io/api/v1/calendar/economic}
      - NEWS_FAIL_CLOSED=${NEWS_FAIL_CLOSED:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - LICENSE_SERVER_URL=${LICENSE_SERVER_URL:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_STARTER_MONTHLY=${STRIPE_PRICE_STARTER_MONTHLY:-}
      - STRIPE_PRICE_STARTER_ANNUAL=${STRIPE_PRICE_STARTER_ANNUAL:-}
      - STRIPE_PRICE_PROFESSIONAL_MONTHLY=${STRIPE_PRICE_PROFESSIONAL_MONTHLY:-}
      - STRIPE_PRICE_PROFESSIONAL_ANNUAL=${STRIPE_PRICE_PROFESSIONAL_ANNUAL:-}
      - STRIPE_PRICE_ENTERPRISE_MONTHLY=${STRIPE_PRICE_ENTERPRISE_MONTHLY:-}
      - STRIPE_PRICE_ENTERPRISE_ANNUAL=${STRIPE_PRICE_ENTERPRISE_ANNUAL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qsp-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qsp-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - qsp-network

  nginx:
    image: nginx:alpine
    container_name: qsp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - qsp-network

  prometheus:
    image: prom/prometheus:latest
    container_name: qsp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - qsp-network

  grafana:
    image: grafana/grafana:latest
    container_name: qsp-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - qsp-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  qsp-network:
    driver: bridge
