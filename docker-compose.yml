version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qsp-postgres
    environment:
      POSTGRES_USER: qsp_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: quantum_scalper_pro
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsp_admin -d quantum_scalper_pro"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qsp-network

  redis:
    image: redis:7-alpine
    container_name: qsp-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - qsp-network
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qsp-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://qsp_admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/quantum_scalper_pro
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PRIVATE_MODE=true
      - OWNER_EMAIL=${OWNER_EMAIL:?Set OWNER_EMAIL}
      - PUBLIC_REGISTRATION_ENABLED=false
      - COMMERCIAL_FEATURES_ENABLED=false
      - LIVE_TRADING_ENABLED=${LIVE_TRADING_ENABLED:-false}
      - EMERGENCY_STOP=${EMERGENCY_STOP:-false}
      - STARTUP_RECOVERY_REQUIRED=true
      - METRICS_ENABLED=${METRICS_ENABLED:-false}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY:-}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - MT5_SERVER=${MT5_SERVER:-}
      - MT5_LOGIN=${MT5_LOGIN:-}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - MT5_PATH=${MT5_PATH:-}
      - MT5_XAU_SYMBOL=${MT5_XAU_SYMBOL:-XAUUSD}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - NEWS_API_URL=${NEWS_API_URL:-https://finnhub.io/api/v1/calendar/economic}
      - NEWS_FAIL_CLOSED=${NEWS_FAIL_CLOSED:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qsp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
    container_name: qsp-frontend
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - qsp-network
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    container_name: qsp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - qsp-network

  prometheus:
    image: prom/prometheus:latest
    container_name: qsp-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - qsp-network

  grafana:
    image: grafana/grafana:latest
    container_name: qsp-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
    volumes:
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - qsp-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  qsp-network:
    driver: bridge
